<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassCount</title>

    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/toolbar.css">
</head>

<body>

<header>
    <h2>ClassCount</h2>

    <nav>
        <button id="previousBtn">◀</button>
        <button id="nextBtn">▶</button>
        <button id="fitBtn">Fit</button>
        <button id="saveBtn">💾 Save</button>
    </nav>
</header>

<div id="workspace">

    <aside id="sidebar">
        <input id="searchBox" type="search" placeholder="Search image...">
        <ul id="imageList"></ul>
    </aside>

    <main id="viewer">

        <section id="imageInfo"></section>

        <section id="toolbar">
            <button id="selectTool">Select</button>
            <button id="boxTool">Student</button>
            <button id="undoBtn">Undo</button>
            <button id="redoBtn">Redo</button>
        </section>

        <section id="canvasContainer">
            <canvas id="annotationCanvas"></canvas>
        </section>

        <footer id="statusBar"></footer>

    </main>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
