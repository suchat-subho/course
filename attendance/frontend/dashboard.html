<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet"
      href="css/dashboard.css">

</head>

<body>

<header>

<h1>Dataset Dashboard</h1>

<a href="index.html">Home</a>

</header>

<main>

<div class="stats">

<div class="card">
<h2>Total Images</h2>
<p id="totalImages">0</p>
</div>

<div class="card">
<h2>Completed</h2>
<p id="completedImages">0</p>
</div>

<div class="card">
<h2>Pending</h2>
<p id="pendingImages">0</p>
</div>

<div class="card">
<h2>Average Count</h2>
<p id="averageCount">0</p>
</div>

</div>

<table id="summaryTable">

<thead>

<tr>

<th>Date</th>

<th>Class</th>

<th>Status</th>

<th>Count</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</main>

<script type="module"
        src="js/app.js"></script>

</body>

</html>
