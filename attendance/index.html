<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Attendance Verification</title>
  <link rel="stylesheet" href="styles_note.css">
  <style>
    /* Custom styling to align attendance elements with styles_note.css */
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .image-preview {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
      margin-top: 10px;
    }
    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div id="top-links">
    <a href="#">Attendance Portal</a>
  </div>

  <div id="content-wrapper">
    <div class="container">

      <div class="note">
        <h3>Mark Attendance</h3>
        <form id="attendanceForm">
          <div class="form-group">
            <label for="classDate">Class Date</label>
            <select id="classDate" required onchange="onDateChange()">
              <option value="">-- Select Date --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="groupName">Group Name</label>
            <select id="groupName" required onchange="updatePreview()">
              <option value="">-- Select Group --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="email">Student Email ID</label>
            <input type="email" id="email" placeholder="student@example.com" required>
          </div>

          <div class="form-group">
            <label for="rollNumber">Roll Number</label>
            <input type="text" id="rollNumber" placeholder="e.g. 10210345" required>
          </div>

          <div class="form-group">
            <label for="serialNumber">Annotated Serial Number</label>
            <input type="number" id="serialNumber" placeholder="e.g. 14" required>
          </div>

          <button type="submit" id="submitBtn" class="button" style="width: 100%; cursor: pointer;">Submit Attendance</button>
        </form>

        <div id="loaderContainer" class="loading-container" style="display: none; margin-top: 15px;">
          <div class="loader"></div>
          <div class="loading-message">Submitting attendance record...</div>
        </div>

        <div id="statusAlert" style="display: none;"></div>
      </div>

      <div class="note">
        <h3>Classroom Image Preview</h3>
        <p><em>Check your annotated serial number from the classroom preview image below.</em></p>
        <img id="previewImg" class="image-preview" src="" alt="Select Date and Group to view image." onerror="this.src=''; this.alt='Image not found for the selected Date and Group.';">
      </div>

    </div>
  </div>

<script>
  // Google Apps Script Web App URL [cite: 56, 58]
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwqoOye-M2llgR4hso3Z71EkoAwcCiTRo6CPqjVbdjCTo2exHA-bNa4CpkA7ReA5lFUg/exec";

  // GitHub repository details [cite: 21, 51]
  const REPO_OWNER = "suchat-subho";
  const REPO_NAME = "course";
  const FOLDER_PATH = "attendance/Dataset/Preview";

  let availableData = {};

  // Fetch available preview files from GitHub API [cite: 49, 51]
  window.onload = function() {
    const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}`;
    alert(apiUrl);
    fetch(apiUrl)
      .then(res => res.json())
      .then(files => {
        if (!Array.isArray(files)) return;

        files.forEach(file => {
          if (file.name.endsWith('.jpg') || file.name.endsWith('.png') || file.name.endsWith('.jpeg')) {
            const fileNameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'));
            const parts = fileNameWithoutExt.split('_');

            if (parts.length >= 4) {
              const group = parts.pop();
              const date = parts.join('_');

              if (!availableData[date]) {
                availableData[date] = [];
              }
              if (!availableData[date].includes(group)) {
                availableData[date].push(group);
              }
            }
          }
        });

        populateDateDropdown();
      })
      .catch(err => {
        console.error("Error fetching preview folder files:", err);
      });
  };

  function populateDateDropdown() {
    const dateSelect = document.getElementById('classDate');
    dateSelect.innerHTML = '<option value="">-- Select Date --</option>';

    Object.keys(availableData).forEach(date => {
      const opt = document.createElement('option');
      opt.value = date;
      opt.textContent = date;
      dateSelect.appendChild(opt);
    });
  }

  function onDateChange() {
    const selectedDate = document.getElementById('classDate').value;
    const groupSelect = document.getElementById('groupName');
    
    groupSelect.innerHTML = '<option value="">-- Select Group --</option>';

    if (selectedDate && availableData[selectedDate]) {
      availableData[selectedDate].forEach(group => {
        const opt = document.createElement('option');
        opt.value = group;
        opt.textContent = group;
        groupSelect.appendChild(opt);
      });
    }

    updatePreview();
  }

  function updatePreview() {
    const date = document.getElementById('classDate').value;
    const group = document.getElementById('groupName').value;
    const imgElement = document.getElementById('previewImg');

    if (date && group) {
      imgElement.src = `Dataset/Preview/${date}_${group}.jpg`;
      imgElement.alt = "Loading image...";
    } else {
      imgElement.src = "";
      imgElement.alt = "Select Date and Group to view image.";
    }
  }

  // Handle Submission [cite: 30, 43]
  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const alertDiv = document.getElementById('statusAlert');
    const loaderContainer = document.getElementById('loaderContainer');
    
    submitBtn.disabled = true;
    loaderContainer.style.display = "block";
    alertDiv.style.display = "none";

    const payload = {
      date: document.getElementById('classDate').value,
      group: document.getElementById('groupName').value,
      email: document.getElementById('email').value.trim(),
      rollNumber: document.getElementById('rollNumber').value.trim(),
      serialNumber: document.getElementById('serialNumber').value.trim()
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alertDiv.style.display = "block";
      if (data.status === "success") {
        alertDiv.className = "green-box"; // Uses .green-box from styles_note.css
        alertDiv.innerText = data.message;
        document.getElementById('attendanceForm').reset();
        document.getElementById('groupName').innerHTML = '<option value="">-- Select Group --</option>';
        document.getElementById('previewImg').src = "";
      } else {
        alertDiv.className = "alert-error";
        alertDiv.innerText = data.message;
      }
    })
    .catch(err => {
      alertDiv.style.display = "block";
      alertDiv.className = "alert-error";
      alertDiv.innerText = "Error connecting to server. Please try again.";
      console.error(err);
    })
    .finally(() => {
      submitBtn.disabled = false;
      loaderContainer.style.display = "none";
    });
  });
</script>

</body>
</html>
