<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Student Attendance Form</h1>

  <form id="attendanceForm">
    
    <div class="form-group">
      <label for="classDate">Select Date</label>
      <select id="classDate" required>
        <option value="">Loading dates...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="groupName">Select Group</label>
      <select id="groupName" required disabled>
        <option value="">Select Date First</option>
      </select>
    </div>

    <div class="image-preview-box">
      <span id="previewPlaceholder" class="image-placeholder">Select Date & Group to view preview</span>
      <img id="previewImg" alt="Classroom seating layout">
    </div>

    <div class="form-group">
      <label for="email">Student Email</label>
      <input type="email" id="email" placeholder="student@example.com" required>
    </div>

    <div class="form-group">
      <label for="rollNumber">Roll Number</label>
      <input type="text" id="rollNumber" placeholder="e.g. 102103001" required>
    </div>

    <div class="form-group">
      <label for="serialNumber">Seat / Serial Number</label>
      <input type="number" id="serialNumber" placeholder="e.g. 12" required min="1">
    </div>

    <button type="submit" id="submitBtn">Submit Attendance</button>
  </form>

  <div id="statusMessage" class="status-msg"></div>
</div>

<script src="script.js"></script>
</body>
</html>
